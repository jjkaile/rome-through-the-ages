  <path class="light" d="M230,290 C232,295 228,300 225,298" />
  <path class="light" d="M310,280 C312,286 308,290 305,288" />
  <path class="light" d="M400,285 C403,290 400,296 396,293" />
  <path class="light" d="M460,300 C463,306 460,312 456,308" />

  <path class="light" d="M200,350 C204,355 200,362 196,358" />
  <path class="light" d="M260,345 C263,350 260,356 256,353" />
  <path class="light" d="M340,340 C343,346 340,352 336,348" />
  <path class="light" d="M440,350 C443,356 440,362 436,358" />
  <path class="light" d="M510,360 C513,366 510,372 506,368" />

  <path class="light" d="M220,410 C224,416 220,422 216,418" />
  <path class="light" d="M300,405 C303,411 300,416 296,413" />
  <path class="light" d="M380,408 C383,414 380,420 376,416" />
  <path class="light" d="M460,415 C463,420 460,426 456,422" />

  <path class="light" d="M250,470 C253,476 250,482 246,478" />
  <path class="light" d="M350,465 C353,471 350,477 346,473" />
  <path class="light" d="M440,475 C443,480 440,486 436,482" />

  <!-- Stippling / dot texture for rough stone -->
  <circle cx="240" cy="320" r="1" fill="#8a8a8a" />
  <circle cx="260" cy="335" r="1" fill="#8a8a8a" />
  <circle cx="290" cy="310" r="1" fill="#8a8a8a" />
  <circle cx="320" cy="325" r="1" fill="#8a8a8a" />
  <circle cx="355" cy="315" r="1" fill="#8a8a8a" />
  <circle cx="380" cy="330" r="1" fill="#8a8a8a" />
  <circle cx="410" cy="320" r="1" fill="#8a8a8a" />
  <circle cx="445" cy="335" r="1" fill="#8a8a8a" />
  <circle cx="470" cy="315" r="1" fill="#8a8a8a" />

  <circle cx="215" cy="375" r="1" fill="#8a8a8a" />
  <circle cx="250" cy="385" r="1" fill="#8a8a8a" />
  <circle cx="285" cy="370" r="1" fill="#8a8a8a" />
  <circle cx="330" cy="385" r="1" fill="#8a8a8a" />
  <circle cx="370" cy="375" r="1" fill="#8a8a8a" />
  <circle cx="410" cy="385" r="1" fill="#8a8a8a" />
  <circle cx="450" cy="378" r="1" fill="#8a8a8a" />
  <circle cx="490" cy="390" r="1" fill="#8a8a8a" />

  <circle cx="230" cy="440" r="1" fill="#8a8a8a" />
  <circle cx="275" cy="448" r="1" fill="#8a8a8a" />
  <circle cx="320" cy="440" r="1" fill="#8a8a8a" />
  <circle cx="365" cy="450" r="1" fill="#8a8a8a" />
  <circle cx="410" cy="442" r="1" fill="#8a8a8a" />
  <circle cx="455" cy="452" r="1" fill="#8a8a8a" />
  <circle cx="500" cy="445" r="1" fill="#8a8a8a" />

  <!-- ====== THE CHISEL MARK - where it was cut from the mountain ====== -->
  <!-- Top of the stone has a rough, jagged break line - not smoothly cut -->
  <path class="heavy" d="M200,278
    C208,268 218,258 230,252
    C245,245 258,238 275,232
    C292,226 310,222 330,218
    C348,215 365,215 385,218
    C405,222 425,228 442,235
    C458,242 472,250 485,260
    C498,270 508,278 515,284" />

  <!-- Jagged break marks at top edge -->
  <path class="pencil" d="M215,268 L210,258 L220,262 L218,252 L228,256" />
  <path class="pencil" d="M260,248 L255,238 L265,242 L262,232 L272,236" />
  <path class="pencil" d="M310,232 L308,222 L318,225 L315,218 L325,220" />
  <path class="pencil" d="M375,218 L378,210 L385,215 L382,208 L392,212" />
  <path class="pencil" d="M440,238 L445,228 L452,234 L448,225 L458,230" />
  <path class="pencil" d="M490,262 L495,252 L502,258 L498,248 L508,255" />

  <!-- ====== SHADOW underneath ====== -->
  <ellipse cx="350" cy="565" rx="200" ry="25" fill="#2a2a3e" fill-opacity="0.3" />

  <!-- ====== SMALL DEBRIS / CHIPS around the stone ====== -->
  <!-- Little rock fragments that chipped off -->
  <polygon class="pencil" points="130,500 140,495 145,505 135,508" />
  <polygon class="pencil" points="560,510 570,505 575,515 565,518" />
  <polygon class="pencil" points="180,545 188,540 192,548 184,550" />
  <polygon class="pencil" points="520,550 528,545 530,553 522,555" />
  <polygon class="pencil" points="250,558 256,554 260,560 253,562" />
  <polygon class="pencil" points="450,560 456,556 460,562 453,565" />
  <!-- Tiny chips -->
  <polygon class="light" points="150,530 154,527 156,532" />
  <polygon class="light" points="545,535 549,530 551,536" />
  <polygon class="light" points="300,565 304,562 305,567" />
  <polygon class="light" points="400,567 404,563 406,569" />

  <!-- ====== DUST PARTICLES floating up ====== -->
  <circle cx="160" cy="260" r="1.5" fill="#8a8a8a" fill-opacity="0.4" />
  <circle cx="180" cy="240" r="1" fill="#8a8a8a" fill-opacity="0.3" />
  <circle cx="540" cy="260" r="1.5" fill="#8a8a8a" fill-opacity="0.4" />
  <circle cx="520" cy="235" r="1" fill="#8a8a8a" fill-opacity="0.3" />
  <circle cx="350" cy="195" r="1.5" fill="#8a8a8a" fill-opacity="0.4" />
  <circle cx="310" cy="200" r="1" fill="#8a8a8a" fill-opacity="0.3" />
  <circle cx="400" cy="198" r="1" fill="#8a8a8a" fill-opacity="0.3" />

  <!-- ====== TEXT ====== -->
  <text x="350" y="640" text-anchor="middle" font-family="Permanent Marker, cursive" font-size="28" fill="#88BBDD">"not cut by human hands"</text>
  <text x="350" y="670" text-anchor="middle" font-family="Comic Neue, sans-serif" font-size="14" fill="#777">— Daniel 2:34</text>

  <!-- The question -->
  <text x="350" y="720" text-anchor="middle" font-family="Comic Neue, sans-serif" font-size="16" fill="#666">rough. unpolished. unhewn.</text>
  <text x="350" y="745" text-anchor="middle" font-family="Comic Neue, sans-serif" font-size="16" fill="#666">no human fingerprints on it.</text>
  <text x="350" y="775" text-anchor="middle" font-family="Comic Neue, sans-serif" font-size="14" fill="#555">and it destroys everything.</text>

</svg>
