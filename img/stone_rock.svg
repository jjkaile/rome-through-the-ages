  <line class="glow" x1="350" y1="380" x2="500" y2="10" />
  <line class="glow" x1="350" y1="380" x2="580" y2="30" />
  <line class="glow" x1="350" y1="380" x2="650" y2="80" />
  <line class="glow" x1="350" y1="380" x2="690" y2="180" />
  <line class="glow" x1="350" y1="380" x2="695" y2="300" />
  <line class="glow" x1="350" y1="380" x2="10" y2="180" />
  <line class="glow" x1="350" y1="380" x2="5" y2="300" />
  <line class="glow" x1="350" y1="380" x2="690" y2="420" />
  <line class="glow" x1="350" y1="380" x2="10" y2="420" />
  <line class="glow" x1="350" y1="380" x2="660" y2="550" />
  <line class="glow" x1="350" y1="380" x2="40" y2="550" />

  <!-- Second ring of rays, slightly offset -->
  <line class="glow" x1="350" y1="380" x2="80" y2="140" />
  <line class="glow" x1="350" y1="380" x2="160" y2="50" />
  <line class="glow" x1="350" y1="380" x2="250" y2="15" />
  <line class="glow" x1="350" y1="380" x2="450" y2="15" />
  <line class="glow" x1="350" y1="380" x2="540" y2="50" />
  <line class="glow" x1="350" y1="380" x2="620" y2="140" />

  <!-- ====== THE STONE itself ====== -->
  <!-- Main stone shape - rough, hewn, NOT smooth - "cut without hands" -->
  <path class="heavy stone-fill" d="M185,280
    C175,295 160,315 155,340
    C148,370 150,400 158,430
    C165,458 178,478 195,495
    C215,515 240,528 265,535
    C290,542 320,545 350,545
    C380,545 410,542 435,535
    C460,528 485,515 505,495
    C522,478 535,458 542,430
    C550,400 552,370 545,340
    C540,315 525,295 515,280
    C500,255 480,240 455,230
    C430,218 400,215 370,215
    C340,215 310,218 285,228
    C258,238 235,252 215,268
    C200,278 190,282 185,280 Z" />

  <!-- ====== ROUGH HEWN FACETS - not smooth, cut by God not man ====== -->
  <!-- Major fracture lines across the stone face -->
  <path class="pencil" d="M200,310 C230,305 270,298 320,300 C370,302 420,310 470,325 C500,335 520,340 535,348" />
  <path class="pencil" d="M165,380 C200,370 250,365 310,368 C370,370 430,378 490,392 C520,400 540,408 548,415" />
  <path class="pencil" d="M175,440 C210,432 260,428 320,430 C380,432 430,440 480,455 C510,465 530,472 540,478" />

  <!-- Vertical fracture lines -->
  <path class="pencil" d="M280,230 C275,270 272,320 275,370 C278,420 282,470 290,520" />
  <path class="pencil" d="M420,230 C425,270 428,320 425,370 C422,420 418,470 410,520" />

  <!-- Diagonal fracture -->
  <path class="pencil" d="M210,270 C250,310 300,360 340,410 C370,448 395,480 420,510" />
  <path class="pencil" d="M490,270 C450,310 400,360 360,410 C330,448 305,480 280,510" />

