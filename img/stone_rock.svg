<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800">
  <style>
    .pencil { fill: none; stroke: #4a4a4a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .light { fill: none; stroke: #8a8a8a; stroke-width: 0.8; stroke-linecap: round; }
    .heavy { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .construction { fill: none; stroke: #b0b0b0; stroke-width: 0.5; stroke-dasharray: 6 4; }
    .glow { fill: none; stroke: #88BBDD; stroke-width: 0.6; stroke-opacity: 0.5; }
    .stone-fill { fill: #88BBDD; fill-opacity: 0.04; }
  </style>

  <!-- ====== LIGHT RAYS emanating from behind the stone ====== -->
  <!-- Radiating from center outward - the stone glows -->
  <line class="glow" x1="350" y1="380" x2="50" y2="80" />
  <line class="glow" x1="350" y1="380" x2="120" y2="30" />
  <line class="glow" x1="350" y1="380" x2="200" y2="10" />
